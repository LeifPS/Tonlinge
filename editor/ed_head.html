<title>Tonlinge Weltbauer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Werkbank: Papier und Tinte wie im Spiel. Links die Reiter, in der Mitte die Arbeitsfläche, rechts der Prüfer. */
@@FONTS@@
:root {
  --bg: #e9dfc0; --panel: #f8f2de; --panel2: #efe5c6; --ink: #1d2742; --muted: #5c6684; --line: #cbbf97;
  --accent: #2b7a86; --accent-fg: #ffffff; --warm: #b86e08; --good: #2f7a47; --danger: #b8473a; --stage: #2b3350; --hl: rgba(244,201,66,.55);
  --f-display: "Caveat Brush", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Patrick Hand", "Segoe Print", "Bradley Hand", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131a2e; --panel: #1c2440; --panel2: #252f52; --ink: #f2ebd2; --muted: #9ba5c8; --line: #38436b; --accent: #5cc4d0; --accent-fg: #0d1a22; --warm: #f0b050; --good: #6cc488; --danger: #f08a7a; --stage: #0e1324; --hl: rgba(244,201,66,.35); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #131a2e; --panel: #1c2440; --panel2: #252f52; --ink: #f2ebd2; --muted: #9ba5c8; --line: #38436b; --accent: #5cc4d0; --accent-fg: #0d1a22; --warm: #f0b050; --good: #6cc488; --danger: #f08a7a; --stage: #0e1324; --hl: rgba(244,201,66,.35); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.35 var(--f-body); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
#top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 2px solid var(--ink); }
#brand { font: 28px/1 var(--f-display); letter-spacing: .5px; margin-right: 6px; white-space: nowrap; }
#brand small { font: 14px var(--f-body); color: var(--muted); margin-left: 6px; }
#pname { width: 200px; max-width: 100%; }
.sp { flex: 1; }
#stat { font-size: 14px; color: var(--muted); }
#shell { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding-top: 8px; }
#rail { display: flex; flex-direction: column; gap: 6px; }
.nav1, .nav2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#rail .nav1 button { font: 19px var(--f-display); letter-spacing: .3px; padding: 5px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); cursor: pointer; }
#rail .nav1 button:hover { background: var(--panel2); }
#rail .nav1 button[aria-current="true"] { background: var(--ink); color: var(--bg); }
#rail .nav2 { border-bottom: 2px solid var(--line); padding-bottom: 0; }
#rail .nav2 button { padding: 4px 12px; border: 0; border-bottom: 4px solid transparent; border-radius: 6px 6px 0 0; background: none; cursor: pointer; font-size: 17px; margin-bottom: -2px; }
#rail .nav2 button:hover { background: var(--panel2); }
#rail .nav2 button[aria-current="true"] { border-bottom-color: var(--accent); font-weight: bold; }
#nsearch { position: relative; }
#nsearch input { width: 220px; }
#nres { position: absolute; right: 0; top: 100%; z-index: 50; background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; min-width: 280px; max-height: 60vh; overflow: auto; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
#nres button { display: flex; width: 100%; text-align: left; gap: 8px; padding: 5px 10px; border: 0; background: none; cursor: pointer; }
#nres button:hover, #nres button.on { background: var(--panel2); }
#nres small { color: var(--muted); margin-left: auto; }
.home { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
.home button { text-align: left; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 14px; background: var(--panel); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.home button:hover { background: var(--panel2); transform: translateY(-1px); }
.home button b { font: 22px var(--f-display); }
.home button span { color: var(--muted); font-size: 15px; }
.xsw { display: flex; align-items: center; gap: 5px; font-size: 15px; color: var(--muted); }
#rail button { text-align: left; border: 2px solid transparent; background: none; border-radius: 10px; padding: 5px 10px; cursor: pointer; font-size: 17px; }
#rail button:hover { background: var(--panel2); }
#rail button[aria-current="true"] { background: var(--ink); color: var(--bg); }
#rail .grp { font: 13px var(--f-body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); padding: 8px 10px 2px; }
#view { min-width: 0; min-height: 0; overflow: auto; padding-bottom: 14px; }
.btn { border: 2px solid var(--ink); background: var(--panel); border-radius: 10px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel2); }
.btn.pri { background: var(--accent); color: var(--accent-fg); }
.btn.warn { color: var(--danger); }
.btn.sm { padding: 1px 8px; font-size: 15px; }
.btn[aria-pressed="true"], .btn.on { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=number], select, textarea { border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 8px; min-width: 0; max-width: 100%; }
input[type=number] { width: 86px; }
input[type=color] { width: 44px; height: 30px; padding: 1px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel); }
textarea { width: 100%; resize: vertical; min-height: 64px; }
textarea.code { font: 14px/1.35 var(--f-mono); min-height: 150px; white-space: pre; }
input[type=range] { accent-color: var(--accent); }
.card { background: var(--panel); border: 2px solid var(--ink); border-radius: 14px 6px 14px 6px / 6px 14px 6px 14px; padding: 12px; }
.two { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 300px); overflow: auto; padding-right: 2px; }
.list .it { text-align: left; border: 2px solid transparent; background: none; border-radius: 8px; padding: 3px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.list .it:hover { background: var(--panel2); }
.list .it[aria-current="true"] { background: var(--hl); border-color: var(--ink); }
.list .gh { font-size: 13px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); padding: 8px 6px 1px; }
.list .it i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }
.list .it small { color: var(--muted); margin-left: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fld > span { font-size: 14px; color: var(--muted); }
.fld > em { font-size: 13px; color: var(--muted); font-style: normal; }
h2 { font: 30px/1.05 var(--f-display); margin: 0 0 8px; font-weight: 400; }
h3 { font: 21px/1.1 var(--f-display); margin: 14px 0 6px; font-weight: 400; letter-spacing: .3px; }
.muted { color: var(--muted); }
.tag { display: inline-block; border: 1.5px solid var(--ink); border-radius: 99px; padding: 0 8px; font-size: 14px; background: var(--panel2); }
.tag.good { background: var(--good); color: var(--bg); border-color: var(--good); } .tag.bad { background: var(--danger); color: var(--bg); border-color: var(--danger); }
.sw { display: inline-block; width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--ink); vertical-align: middle; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
.pal button { padding: 0; border: 2px solid var(--line); border-radius: 8px; background: var(--panel2); cursor: pointer; aspect-ratio: 1; position: relative; overflow: hidden; }
.pal button:hover { border-color: var(--ink); }
.pal button[aria-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent); }
.pal button canvas { width: 100%; height: 100%; display: block; }
.pal button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; line-height: 1.1; background: rgba(20,25,45,.72); color: #fff; padding: 1px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: 0; }
.pal button:hover span { opacity: 1; }
.ph { font-size: 13px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); margin: 8px 0 3px; }
#wrap { display: grid; grid-template-columns: 252px minmax(0, 1fr) 232px; gap: 10px; height: calc(100vh - 215px); min-height: 460px; }
#wrap > * { min-height: 0; }
.side { overflow: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
#stage { position: relative; background: var(--stage); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; touch-action: none; }
#wcv { width: 100%; height: 100%; display: block; cursor: crosshair; }
#hud { position: absolute; left: 8px; bottom: 8px; background: rgba(20,25,45,.82); color: #fff; font-size: 14px; border-radius: 8px; padding: 2px 8px; pointer-events: none; }
#mini { position: absolute; right: 8px; top: 8px; border: 2px solid var(--ink); border-radius: 6px; background: rgba(20,25,45,.55); cursor: pointer; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tools .btn { padding: 3px 2px; text-align: center; font-size: 15px; }
.scr { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; } table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: middle; } table.t th { color: var(--muted); font-weight: 400; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.bar { height: 10px; background: var(--panel2); border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; min-width: 60px; } .bar > i { display: block; height: 100%; background: var(--accent); }
.item { border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; margin: 4px 0; background: var(--panel2); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 50; pointer-events: none; align-items: center; }
#toast div { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 6px 14px; max-width: 80vw; }
#toast div.bad { background: var(--danger); color: #fff; }
#modal { position: fixed; inset: 0; background: rgba(10,14,30,.55); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 14px; }
#modal[hidden] { display: none; }
#modal .box { background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; max-width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 14px; width: 100%; }
.pv { background: var(--stage); border: 2px solid var(--ink); border-radius: 10px; display: block; max-width: 100%; }
.pvl { background: #a9dc86; }
code, .mono { font: 14px var(--f-mono); }
details { margin: 6px 0; } summary { cursor: pointer; font-family: var(--f-display); font-size: 20px; }
.issue { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 1100px) { #wrap { grid-template-columns: 220px minmax(0, 1fr); height: auto; } #wrap > .side:last-child { grid-column: 1 / -1; } #stage { height: 62vh; } }
@media (max-width: 760px) { #shell { grid-template-columns: minmax(0, 1fr); } #nsearch input { width: 150px; } .two { grid-template-columns: minmax(0, 1fr); } .list { max-height: 220px; } #wrap { grid-template-columns: minmax(0, 1fr); } #stage { order: -1; height: 58vh; } #brand small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.tbl{border-collapse:collapse;width:100%;font-size:15px}.tbl th{text-align:left;font-weight:normal;color:var(--muted);font-size:13px;padding:2px 6px;border-bottom:2px solid var(--line)}.tbl td{padding:2px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}.tbl .bar{display:inline-block;vertical-align:middle;margin-right:6px}
</style>
<canvas id="cv" hidden></canvas>
<header id="top">
  <div id="brand">Tonlinge Weltbauer<small>für dein eigenes Spiel</small></div>
  <input type="text" id="pname" placeholder="Name der Welt" aria-label="Name der Welt">
  <button class="btn" id="bUndo" title="Rückgängig (Strg+Z)">↶</button><button class="btn" id="bRedo" title="Wiederholen (Strg+Y)">↷</button>
  <span class="sp"></span><span id="stat"></span>
  <button class="btn pri" id="bPlay" title="Deine Welt direkt ausprobieren">▶ Testspiel</button><button class="btn" id="bOpen">Öffnen</button><button class="btn pri" id="bSave">Speichern</button><button class="btn" id="bMore">Mehr</button>
  <input type="file" id="fOpen" accept=".json,application/json" hidden>
</header>
<div id="shell"><nav id="rail" aria-label="Bereiche des Editors"></nav><main id="view"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
